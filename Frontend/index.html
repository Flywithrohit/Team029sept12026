<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduITalent CRM</title>
    <link rel="icon" type="image/png" href="/uploads/Logo/Fevicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --crm-ink: #10243e;
            --crm-navy: #16365c;
            --crm-blue: #2b6cb0;
            --crm-cyan: #7dd3fc;
            --crm-gold: #f6c453;
            --crm-purple: #6f2cff;
            --crm-purple-deep: #4d179f;
            --crm-slate: #5f7389;
            --crm-surface: rgba(255, 255, 255, 0.84);
            --crm-surface-solid: #ffffff;
            --crm-surface-soft: rgba(255, 255, 255, 0.7);
            --crm-border: rgba(16, 36, 62, 0.12);
            --crm-shadow: 0 25px 60px rgba(7, 24, 46, 0.18);
            --crm-shadow-soft: 0 18px 35px rgba(16, 36, 62, 0.08);
            --crm-sidebar: #24303c;
            --crm-sidebar-soft: #313d49;
            --crm-sidebar-width: 288px;
            --crm-sidebar-collapsed-width: 92px;
            --crm-sidebar-transition: 280ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        body {
            background:
                radial-gradient(circle at top left, rgba(125, 211, 252, 0.35), transparent 35%),
                radial-gradient(circle at bottom right, rgba(246, 196, 83, 0.22), transparent 30%),
                linear-gradient(135deg, #f6f8fb 0%, #eef5fb 48%, #fdf9ef 100%);
            color: var(--crm-ink);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        a { color: var(--crm-blue); }
        .app-shell {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }
        .crm-sidebar {
            min-height: 100vh;
            height: 100vh;
            position: relative;
            flex: 0 0 var(--crm-sidebar-width);
            width: var(--crm-sidebar-width);
            background:
                radial-gradient(circle at top, rgba(125, 211, 252, 0.12), transparent 32%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 16%),
                linear-gradient(180deg, var(--crm-sidebar), #1b2530 100%);
            color: white;
            padding: 20px 16px 18px;
            box-shadow: 18px 0 45px rgba(16, 36, 62, 0.16);
            overflow: visible;
            transition: width var(--crm-sidebar-transition), flex-basis var(--crm-sidebar-transition), padding var(--crm-sidebar-transition), box-shadow var(--crm-sidebar-transition);
        }
        .crm-sidebar.is-collapsed {
            flex: 0 0 var(--crm-sidebar-collapsed-width);
            width: var(--crm-sidebar-collapsed-width);
            padding: 20px 12px 18px;
            box-shadow: 12px 0 32px rgba(16, 36, 62, 0.12);
        }
        .crm-sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            padding: 8px 10px 18px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            transition: padding var(--crm-sidebar-transition), justify-content var(--crm-sidebar-transition);
        }
        .crm-sidebar-brand-mark {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 44px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(111, 44, 255, 0.92), rgba(43, 108, 176, 0.95));
            box-shadow: 0 14px 28px rgba(59, 74, 177, 0.28);
            font-size: 1.25rem;
        }
        .crm-sidebar-brand-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: opacity var(--crm-sidebar-transition), transform var(--crm-sidebar-transition), max-width var(--crm-sidebar-transition);
        }
        .crm-sidebar-brand-copy strong {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }
        .crm-sidebar-brand-copy small {
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.76rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .crm-sidebar-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .crm-sidebar-toggle {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }
        .crm-sidebar-toggle i {
            font-size: 1.05rem;
            transition: transform var(--crm-sidebar-transition);
        }
        .crm-sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-1px);
        }
        .crm-sidebar-toggle:active {
            transform: translateY(0) scale(0.97);
        }
        .crm-sidebar-menu {
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }
        .crm-sidebar-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1035;
            border: 0;
            background: rgba(10, 19, 32, 0.42);
            backdrop-filter: blur(4px);
        }
        .crm-sidebar-nav {
            display: grid;
            gap: 8px;
            padding-top: 4px;
        }
        .crm-sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            min-height: 56px;
            padding: 10px 14px;
            border-radius: 18px;
            border: 1px solid transparent;
            color: rgba(255, 255, 255, 0.78);
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
        }
        .crm-sidebar-link::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 50%;
            width: 4px;
            height: 28px;
            border-radius: 999px;
            background: rgba(125, 211, 252, 0.95);
            transform: translateY(-50%) scaleY(0.35);
            transform-origin: center;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .crm-sidebar-link-icon {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.92);
            font-size: 1.1rem;
            transition: background-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }
        .crm-sidebar-link-label {
            flex: 1;
            min-width: 0;
            font-size: 0.96rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity var(--crm-sidebar-transition), transform var(--crm-sidebar-transition), max-width var(--crm-sidebar-transition);
        }
        .crm-sidebar-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }
        .crm-sidebar-link:hover .crm-sidebar-link-icon {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        .crm-sidebar-link.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(111, 44, 255, 0.95), rgba(43, 108, 176, 0.88));
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 28px rgba(37, 59, 150, 0.28);
        }
        .crm-sidebar-link.active::before {
            opacity: 1;
            transform: translateY(-50%) scaleY(1);
        }
        .crm-sidebar-link.active .crm-sidebar-link-icon {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }
        .crm-sidebar-profile {
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .crm-sidebar-profile-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            padding: 12px;
            border-radius: 18px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .crm-sidebar-profile-toggle:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
        .crm-sidebar-avatar {
            flex: 0 0 40px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
        }
        .crm-sidebar-profile-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: opacity var(--crm-sidebar-transition), transform var(--crm-sidebar-transition), max-width var(--crm-sidebar-transition);
        }
        .crm-sidebar-profile-copy strong,
        .crm-sidebar-profile-copy small {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .crm-sidebar-profile-copy strong {
            font-size: 0.92rem;
        }
        .crm-sidebar-profile-copy small {
            font-size: 0.76rem;
            color: rgba(255, 255, 255, 0.58);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .crm-sidebar.is-collapsed .crm-sidebar-top {
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .crm-sidebar.is-collapsed .crm-sidebar-brand {
            justify-content: center;
            width: 100%;
            padding-inline: 0;
        }
        .crm-sidebar.is-collapsed .crm-sidebar-brand-copy,
        .crm-sidebar.is-collapsed .crm-sidebar-link-label,
        .crm-sidebar.is-collapsed .crm-sidebar-profile-copy {
            opacity: 0;
            max-width: 0;
            transform: translateX(-8px);
            pointer-events: none;
        }
        .crm-sidebar.is-collapsed .crm-sidebar-toggle i {
            transform: rotate(180deg);
        }
        .crm-sidebar.is-collapsed .crm-sidebar-nav {
            justify-items: center;
        }
        .crm-sidebar.is-collapsed .crm-sidebar-link {
            justify-content: center;
            width: 100%;
            min-height: 58px;
            padding-inline: 0;
            gap: 0;
        }
        .crm-sidebar.is-collapsed .crm-sidebar-link::before {
            left: 50%;
            top: auto;
            bottom: 6px;
            width: 28px;
            height: 4px;
            transform: translateX(-50%) scaleX(0.35);
        }
        .crm-sidebar.is-collapsed .crm-sidebar-link.active::before {
            transform: translateX(-50%) scaleX(1);
        }
        .crm-sidebar.is-collapsed .crm-sidebar-link-icon {
            width: 44px;
            height: 44px;
            flex-basis: 44px;
        }
        .crm-sidebar.is-collapsed .crm-sidebar-profile-toggle {
            justify-content: center;
            padding-inline: 0;
        }
        .crm-sidebar.is-collapsed .dropdown-toggle::after {
            display: none;
        }
        .crm-sidebar.is-collapsed [data-tooltip]::after,
        .crm-sidebar.is-collapsed [data-tooltip]::before {
            position: absolute;
            left: calc(100% + 14px);
            top: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 20;
        }
        .crm-sidebar.is-collapsed [data-tooltip]::after {
            content: attr(data-tooltip);
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(17, 24, 39, 0.94);
            color: #fff;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 14px 28px rgba(10, 19, 32, 0.22);
            transform: translate(8px, -50%);
        }
        .crm-sidebar.is-collapsed [data-tooltip]::before {
            content: "";
            width: 10px;
            height: 10px;
            background: rgba(17, 24, 39, 0.94);
            transform: translate(4px, -50%) rotate(45deg);
        }
        .crm-sidebar.is-collapsed [data-tooltip]:hover::after,
        .crm-sidebar.is-collapsed [data-tooltip]:hover::before {
            opacity: 1;
        }
        .crm-sidebar.is-collapsed [data-tooltip]:hover::after {
            transform: translate(0, -50%);
        }
        .crm-sidebar.is-collapsed [data-tooltip]:hover::before {
            transform: translate(0, -50%) rotate(45deg);
        }
        .crm-main {
            flex: 1;
            padding: 28px;
            min-width: 0;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .crm-page {
            max-width: 100%;
        }
        .crm-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 24px;
        }
        .crm-page-title {
            margin: 0;
            font-size: clamp(1.9rem, 3vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #1f5fff;
        }
        .crm-page-subtitle {
            margin: 6px 0 0;
            color: var(--crm-slate);
        }
        .crm-date-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--crm-border);
            box-shadow: var(--crm-shadow-soft);
            color: var(--crm-ink);
            font-weight: 600;
        }
        .crm-card {
            border: 1px solid var(--crm-border);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--crm-shadow-soft);
            overflow: hidden;
        }
        .crm-profile-snapshot {
            padding: 18px;
            border: 1px solid rgba(43, 108, 176, 0.12);
            border-radius: 18px;
            background:
                radial-gradient(circle at top right, rgba(31, 95, 255, 0.08), transparent 35%),
                linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(241, 247, 255, 0.92));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }
        .crm-profile-snapshot-head {
            margin-bottom: 14px;
        }
        .crm-profile-snapshot-kicker {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 4px 10px;
            margin-bottom: 8px;
            border-radius: 999px;
            background: rgba(31, 95, 255, 0.1);
            color: var(--crm-blue);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .crm-profile-meta-grid {
            display: grid;
            gap: 12px;
        }
        .crm-profile-meta-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid rgba(16, 36, 62, 0.08);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 10px 24px rgba(16, 36, 62, 0.06);
        }
        .crm-profile-meta-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(31, 95, 255, 0.14), rgba(111, 44, 255, 0.12));
            color: var(--crm-blue);
            font-size: 1.05rem;
        }
        .crm-profile-meta-content {
            min-width: 0;
            flex: 1;
        }
        .crm-profile-meta-label {
            color: var(--crm-slate);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .crm-profile-meta-value {
            margin-top: 3px;
            color: var(--crm-ink);
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.35;
            word-break: break-word;
        }
        .crm-card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--crm-border);
            background: rgba(255, 255, 255, 0.76);
        }
        .crm-card-body {
            padding: 22px;
        }
        .crm-section-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--crm-ink);
        }
        .crm-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .crm-search {
            position: relative;
            display: block;
        }
        .crm-search-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 1rem;
        }
        .crm-search-row .crm-search {
            flex: 1 1 auto;
            min-width: 0;
            margin-bottom: 0 !important;
        }
        .crm-search-count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            min-height: 38px;
            padding: 0.45rem 0.85rem;
            border-radius: 999px;
            background: rgba(240, 246, 252, 0.95);
            color: var(--crm-blue);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65);
        }
        .crm-search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            z-index: 2;
            color: #9aa3af;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .crm-search .form-control,
        .crm-search-input.form-control {
            height: 38px;
            width: 100%;
            padding: 6px 12px 6px 42px;
            border-radius: 8px !important;
            border: 1px solid var(--crm-border);
            background: rgba(255, 255, 255, 0.94);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
            font-size: 14px;
            line-height: 1.35;
        }
        .crm-search .form-control:focus,
        .crm-search-input.form-control:focus {
            border-color: rgba(43, 108, 176, 0.28);
            box-shadow: 0 0 0 0.18rem rgba(43, 108, 176, 0.1);
        }
        .crm-search .form-control::placeholder,
        .crm-search-input.form-control::placeholder {
            color: #7f8ea3;
        }
        .crm-page .form-control,
        .crm-page .form-select {
            border-color: rgba(16, 36, 62, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }
        .crm-card .form-control,
        .crm-card .form-select,
        .crm-modal .form-control,
        .crm-modal .form-select,
        .crm-filter-panel .form-control,
        .crm-filter-panel .form-select {
            min-height: 38px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.3;
            background: rgba(255, 255, 255, 0.96);
        }
        .crm-card .form-select,
        .crm-modal .form-select,
        .crm-filter-panel .form-select {
            padding-right: 32px;
        }
        .crm-card .form-select.form-select-sm,
        .crm-modal .form-select.form-select-sm,
        .crm-filter-panel .form-select.form-select-sm {
            min-height: 38px;
            padding-top: 6px;
            padding-bottom: 6px;
            font-size: 14px;
        }
        .crm-card .form-control.form-control-sm,
        .crm-modal .form-control.form-control-sm,
        .crm-filter-panel .form-control.form-control-sm {
            min-height: 38px;
            font-size: 14px;
        }
        .crm-card .crm-search .form-control,
        .crm-modal .crm-search .form-control,
        .crm-filter-panel .crm-search .form-control,
        .crm-card .crm-search-input.form-control,
        .crm-modal .crm-search-input.form-control,
        .crm-filter-panel .crm-search-input.form-control {
            padding-left: 42px;
        }
        .crm-card .form-control:focus,
        .crm-card .form-select:focus,
        .crm-modal .form-control:focus,
        .crm-modal .form-select:focus,
        .crm-filter-panel .form-control:focus,
        .crm-filter-panel .form-select:focus {
            border-color: rgba(43, 108, 176, 0.28);
            box-shadow: 0 0 0 0.18rem rgba(43, 108, 176, 0.1);
        }
        .crm-modal label,
        .crm-card label,
        .crm-filter-panel label {
            display: inline-block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--crm-ink);
        }
        .crm-calendar-field {
            position: relative;
        }
        .crm-calendar-trigger {
            position: relative;
            width: 100%;
            min-height: 42px;
            padding-right: 42px !important;
            text-align: left;
            color: var(--crm-ink);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(241, 247, 255, 0.92));
        }
        .crm-calendar-trigger:hover {
            border-color: rgba(43, 108, 176, 0.28);
        }
        .crm-calendar-trigger:focus {
            border-color: rgba(43, 108, 176, 0.28);
            box-shadow: 0 0 0 0.18rem rgba(43, 108, 176, 0.1);
        }
        .crm-calendar-placeholder {
            color: #7f8ea3;
        }
        .crm-calendar-icon {
            position: absolute;
            top: 50%;
            right: 14px;
            z-index: 4;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            color: var(--crm-blue);
            transform: translateY(-50%);
            pointer-events: none;
        }
        .crm-calendar-field.is-disabled .crm-calendar-icon {
            color: #9aa8b8;
        }
        .crm-calendar-popover {
            border: 1px solid rgba(43, 108, 176, 0.12);
