<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduITalent CRM</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316365c'/%3E%3Cpath d='M20 18h24v28H20z' fill='%23f6c453'/%3E%3Cpath d='M15 46h34' stroke='%23ffffff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --crm-ink: #10243e;
            --crm-navy: #16365c;
            --crm-blue: #2b6cb0;
            --crm-cyan: #7dd3fc;
            --crm-gold: #f6c453;
            --crm-purple: #6f2cff;
            --crm-purple-deep: #4d179f;
            --crm-slate: #5f7389;
            --crm-surface: rgba(255, 255, 255, 0.84);
            --crm-surface-solid: #ffffff;
            --crm-surface-soft: rgba(255, 255, 255, 0.7);
            --crm-border: rgba(16, 36, 62, 0.12);
            --crm-shadow: 0 25px 60px rgba(7, 24, 46, 0.18);
            --crm-shadow-soft: 0 18px 35px rgba(16, 36, 62, 0.08);
            --crm-sidebar: #24303c;
            --crm-sidebar-soft: #313d49;
        }
        body {
            background:
                radial-gradient(circle at top left, rgba(125, 211, 252, 0.35), transparent 35%),
                radial-gradient(circle at bottom right, rgba(246, 196, 83, 0.22), transparent 30%),
                linear-gradient(135deg, #f6f8fb 0%, #eef5fb 48%, #fdf9ef 100%);
            color: var(--crm-ink);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        a { color: var(--crm-blue); }
        .app-shell {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }
        .crm-sidebar {
            min-height: 100vh;
            height: 100vh;
            flex: 0 0 280px;
            width: 280px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 16%),
                linear-gradient(180deg, var(--crm-sidebar), #1e2832 100%);
            color: white;
            padding: 24px 18px;
            box-shadow: 18px 0 45px rgba(16, 36, 62, 0.16);
            overflow: hidden;
        }
        .crm-sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px 16px;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            text-decoration: none;
        }
        .crm-sidebar-brand span {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }
        .crm-sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .crm-sidebar-toggle {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .crm-sidebar-menu {
            display: flex;
            flex: 1;
            flex-direction: column;
        }
        .crm-sidebar-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1035;
            border: 0;
            background: rgba(10, 19, 32, 0.42);
            backdrop-filter: blur(4px);
        }
        .crm-sidebar-nav {
            display: grid;
            gap: 6px;
        }
        .crm-sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.78);
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .crm-sidebar-link:hover,
        .crm-sidebar-link.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(111, 44, 255, 0.95), rgba(43, 108, 176, 0.88));
            box-shadow: 0 14px 26px rgba(64, 58, 178, 0.22);
            transform: translateY(-1px);
        }
        .crm-sidebar-profile {
            margin-top: auto;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }
        .crm-sidebar-profile-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 10px;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.04);
        }
        .crm-main {
            flex: 1;
            padding: 28px;
            min-width: 0;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .crm-page {
            max-width: 100%;
        }
        .crm-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            margin-bottom: 24px;
        }
        .crm-page-title {
            margin: 0;
            font-size: clamp(1.9rem, 3vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #1f5fff;
        }
        .crm-page-subtitle {
            margin: 6px 0 0;
            color: var(--crm-slate);
        }
        .crm-date-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--crm-border);
            box-shadow: var(--crm-shadow-soft);
            color: var(--crm-ink);
            font-weight: 600;
        }
        .crm-card {
            border: 1px solid var(--crm-border);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--crm-shadow-soft);
            overflow: hidden;
        }
        .crm-profile-snapshot {
            padding: 18px;
            border: 1px solid rgba(43, 108, 176, 0.12);
            border-radius: 18px;
            background:
                radial-gradient(circle at top right, rgba(31, 95, 255, 0.08), transparent 35%),
                linear-gradient(160deg, rgba(255, 255, 255, 0.95), rgba(241, 247, 255, 0.92));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }
        .crm-profile-snapshot-head {
            margin-bottom: 14px;
        }
        .crm-profile-snapshot-kicker {
            display: inline-flex;
            align-items: center;
            min-height: 26px;
            padding: 4px 10px;
            margin-bottom: 8px;
            border-radius: 999px;
            background: rgba(31, 95, 255, 0.1);
            color: var(--crm-blue);
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .crm-profile-meta-grid {
            display: grid;
            gap: 12px;
        }
        .crm-profile-meta-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid rgba(16, 36, 62, 0.08);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 10px 24px rgba(16, 36, 62, 0.06);
        }
        .crm-profile-meta-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(31, 95, 255, 0.14), rgba(111, 44, 255, 0.12));
            color: var(--crm-blue);
            font-size: 1.05rem;
        }
        .crm-profile-meta-content {
            min-width: 0;
            flex: 1;
        }
        .crm-profile-meta-label {
            color: var(--crm-slate);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .crm-profile-meta-value {
            margin-top: 3px;
            color: var(--crm-ink);
            font-size: 0.98rem;
            font-weight: 700;
            line-height: 1.35;
            word-break: break-word;
        }
        .crm-card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--crm-border);
            background: rgba(255, 255, 255, 0.76);
        }
        .crm-card-body {
            padding: 22px;
        }
        .crm-section-title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--crm-ink);
        }
        .crm-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .crm-search {
            position: relative;
            display: block;
        }
        .crm-search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            z-index: 2;
            color: #9aa3af;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .crm-search .form-control,
        .crm-search-input.form-control {
            height: 38px;
            width: 100%;
            padding: 6px 12px 6px 42px;
            border-radius: 8px !important;
            border: 1px solid var(--crm-border);
            background: rgba(255, 255, 255, 0.94);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
            font-size: 14px;
            line-height: 1.35;
        }
        .crm-search .form-control:focus,
        .crm-search-input.form-control:focus {
            border-color: rgba(43, 108, 176, 0.28);
            box-shadow: 0 0 0 0.18rem rgba(43, 108, 176, 0.1);
        }
        .crm-search .form-control::placeholder,
        .crm-search-input.form-control::placeholder {
            color: #7f8ea3;
        }
        .crm-page .form-control,
        .crm-page .form-select {
            border-color: rgba(16, 36, 62, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }
        .crm-card .form-control,
        .crm-card .form-select,
        .crm-modal .form-control,
        .crm-modal .form-select,
        .crm-filter-panel .form-control,
        .crm-filter-panel .form-select {
            min-height: 38px;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.3;
            background: rgba(255, 255, 255, 0.96);
        }
        .crm-card .form-select,
        .crm-modal .form-select,
        .crm-filter-panel .form-select {
            padding-right: 32px;
        }
        .crm-card .form-select.form-select-sm,
        .crm-modal .form-select.form-select-sm,
        .crm-filter-panel .form-select.form-select-sm {
            min-height: 38px;
            padding-top: 6px;
            padding-bottom: 6px;
            font-size: 14px;
        }
        .crm-card .form-control.form-control-sm,
        .crm-modal .form-control.form-control-sm,
        .crm-filter-panel .form-control.form-control-sm {
            min-height: 38px;
            font-size: 14px;
        }
        .crm-card .crm-search .form-control,
        .crm-modal .crm-search .form-control,
        .crm-filter-panel .crm-search .form-control,
        .crm-card .crm-search-input.form-control,
        .crm-modal .crm-search-input.form-control,
        .crm-filter-panel .crm-search-input.form-control {
            padding-left: 42px;
        }
        .crm-card .form-control:focus,
        .crm-card .form-select:focus,
        .crm-modal .form-control:focus,
        .crm-modal .form-select:focus,
        .crm-filter-panel .form-control:focus,
        .crm-filter-panel .form-select:focus {
            border-color: rgba(43, 108, 176, 0.28);
            box-shadow: 0 0 0 0.18rem rgba(43, 108, 176, 0.1);
        }
        .crm-modal label,
        .crm-card label,
        .crm-filter-panel label {
            display: inline-block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--crm-ink);
        }
        .crm-calendar-field {
            position: relative;
        }
        .crm-calendar-trigger {
            position: relative;
            width: 100%;
            min-height: 42px;
            padding-right: 42px !important;
            text-align: left;
            color: var(--crm-ink);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(241, 247, 255, 0.92));
        }
        .crm-calendar-trigger:hover {
            border-color: rgba(43, 108, 176, 0.28);
        }
        .crm-calendar-trigger:focus {
            border-color: rgba(43, 108, 176, 0.28);
            box-shadow: 0 0 0 0.18rem rgba(43, 108, 176, 0.1);
        }
        .crm-calendar-placeholder {
            color: #7f8ea3;
        }
        .crm-calendar-icon {
            position: absolute;
            top: 50%;
            right: 14px;
            z-index: 4;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            color: var(--crm-blue);
            transform: translateY(-50%);
            pointer-events: none;
        }
        .crm-calendar-field.is-disabled .crm-calendar-icon {
            color: #9aa8b8;
        }
        .crm-calendar-popover {
            border: 1px solid rgba(43, 108, 176, 0.12);
            border-radius: 18px;
            background:
                radial-gradient(circle at top right, rgba(125, 211, 252, 0.2), transparent 42%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(241, 247, 255, 0.96));
            box-shadow: 0 24px 60px rgba(16, 36, 62, 0.2);
            overflow-x: hidden;
            overflow-y: auto;
            padding: 14px;
            backdrop-filter: blur(12px);
        }
        .crm-calendar-popover.is-datetime {
            width: 332px !important;
        }
        .crm-calendar-popover.is-top {
            box-shadow: 0 -20px 48px rgba(16, 36, 62, 0.18);
        }
        .crm-calendar-popover-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(16, 36, 62, 0.08);
        }
        .crm-calendar-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--crm-ink);
        }
        .crm-calendar-nav {
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 10px;
            color: var(--crm-blue);
            background: rgba(43, 108, 176, 0.08);
        }
        .crm-calendar-nav:hover {
            background: rgba(43, 108, 176, 0.14);
        }
        .crm-calendar-weekdays,
        .crm-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 6px;
        }
        .crm-calendar-weekdays {
            margin-bottom: 8px;
        }
        .crm-calendar-weekdays span {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--crm-slate);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .crm-calendar-day {
            min-height: 36px;
            border: 0;
            border-radius: 10px;
            color: var(--crm-ink);
            font-size: 13px;
            font-weight: 600;
            background: transparent;
        }
        .crm-calendar-day.is-today {
            background: rgba(43, 108, 176, 0.08);
            color: var(--crm-blue);
        }
        .crm-calendar-day:hover,
        .crm-calendar-day:focus {
            background: rgba(43, 108, 176, 0.12);
        }
        .crm-calendar-day.is-selected,
        .crm-calendar-day.is-selected:hover {
            background: linear-gradient(135deg, var(--crm-purple), #3572ff);
            color: #fff;
            box-shadow: 0 12px 20px rgba(89, 75, 226, 0.22);
        }
        .crm-calendar-day.is-muted {
            color: #b4c0cf;
        }
        .crm-calendar-day.is-disabled,
        .crm-calendar-day.is-disabled:hover {
            color: #c5cfdb;
            background: rgba(16, 36, 62, 0.04);
            cursor: not-allowed;
            box-shadow: none;
        }
        .crm-calendar-time {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(16, 36, 62, 0.08);
        }
        .crm-calendar-time-group {
            padding: 10px;
            border: 1px solid rgba(16, 36, 62, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.75);
        }
        .crm-calendar-time-label {
            display: block;
            margin-bottom: 6px;
            color: var(--crm-slate);
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .crm-calendar-time-stepper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
            align-items: center;
        }
        .crm-calendar-time-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 28px;
            border: 0;
            border-radius: 8px;
            background: rgba(43, 108, 176, 0.08);
            color: var(--crm-blue);
        }
        .crm-calendar-time-btn:hover {
            background: rgba(43, 108, 176, 0.14);
        }
        .crm-calendar-time-value {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(235,244,255,0.92));
            color: var(--crm-ink);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }
        .crm-calendar-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
        }
        .crm-calendar-actions .btn {
            min-width: 88px;
            border-radius: 8px;
        }
        .crm-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 22px;
            padding: 8px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid var(--crm-border);
            box-shadow: var(--crm-shadow-soft);
        }
        .crm-tabs::-webkit-scrollbar {
            height: 6px;
        }
        .crm-tabs::-webkit-scrollbar-thumb {
            background: rgba(16, 36, 62, 0.16);
            border-radius: 999px;
        }
        .crm-tab-link {
            padding: 11px 16px !important;
            border: none !important;
            border-radius: 14px !important;
            color: var(--crm-blue) !important;
            font-weight: 600;
            text-decoration: none !important;
        }
        .crm-tab-link.active {
            color: #fff !important;
            background: linear-gradient(135deg, var(--crm-purple), #3572ff) !important;
            box-shadow: 0 14px 24px rgba(93, 79, 224, 0.22);
        }
        .crm-table-wrap {
            border: 1px solid var(--crm-border);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--crm-shadow-soft);
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .crm-table-wrap::-webkit-scrollbar {
            height: 8px;
        }
        .crm-table-wrap::-webkit-scrollbar-thumb {
            background: rgba(16, 36, 62, 0.18);
            border-radius: 999px;
        }
        .crm-table {
            margin-bottom: 0;
            vertical-align: middle;
            min-width: max-content;
            width: 100%;
        }
        .crm-table thead th {
            background: rgba(237, 244, 251, 0.92);
            border-bottom: 1px solid var(--crm-border);
            color: var(--crm-ink);
            font-size: 0.84rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }
        .crm-table tbody td {
            border-color: rgba(16, 36, 62, 0.08);
            color: var(--crm-ink);
        }
        .crm-table tbody tr:hover {
            background: rgba(111, 44, 255, 0.03);
        }
        .crm-stat-card {
            border: 1px solid var(--crm-border);
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(240, 247, 255, 0.88));
            box-shadow: var(--crm-shadow-soft);
            height: 100%;
        }
        .crm-stat-card .card-body {
            padding: 18px 20px;
        }
        .crm-modal .modal-content {
            border: 1px solid var(--crm-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(16, 36, 62, 0.22);
        }
        .crm-modal .modal-header,
        .crm-modal .modal-body {
            padding-left: 24px;
            padding-right: 24px;
        }
        .crm-modal .modal-header {
            padding-top: 22px;
            padding-bottom: 18px;
            background: rgba(255, 255, 255, 0.92);
            border-bottom: 1px solid var(--crm-border);
        }
        .crm-modal .modal-body {
            padding-top: 20px;
            padding-bottom: 24px;
            background: rgba(248, 251, 255, 0.84);
        }
        .crm-assign-modal-dialog {
            max-width: 460px;
        }
        .crm-assign-modal-content {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(243, 248, 255, 0.96));
        }
        .crm-assign-modal-body {
            background:
                radial-gradient(circle at top right, rgba(53, 114, 255, 0.09), transparent 42%),
                rgba(248, 251, 255, 0.92);
        }
        .crm-assign-modal-summary {
            padding: 16px 18px;
            border: 1px solid rgba(43, 108, 176, 0.14);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }
        .crm-assign-modal-summary-label {
            margin-bottom: 6px;
            color: var(--crm-slate);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
